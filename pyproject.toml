[project]
name = "k8s-troubleshooter-mcp"
version = "0.1.0"
description = "Bootstrap Python 3.11 project for Kubernetes Troubleshooter MCP"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
  "mcp[cli]",
  "kubernetes",
  "PyYAML",
  "pydantic",
  "pydantic-settings",
  "python-json-logger",
  "starlette",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
