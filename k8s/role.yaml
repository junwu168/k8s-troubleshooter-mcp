apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-troubleshooter-readonly
  namespace: k8s-troubleshooter
  labels:
    app.kubernetes.io/name: k8s-troubleshooter-mcp
    app.kubernetes.io/part-of: k8s-troubleshooter
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - events
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
