apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-troubleshooter-mcp
  namespace: k8s-troubleshooter
  labels:
    app.kubernetes.io/name: k8s-troubleshooter-mcp
    app.kubernetes.io/part-of: k8s-troubleshooter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-troubleshooter-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-troubleshooter-mcp
        app.kubernetes.io/part-of: k8s-troubleshooter
    spec:
      serviceAccountName: k8s-troubleshooter-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k8s-troubleshooter-mcp
          image: k8s-troubleshooter-mcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
